[package]
name = "transfer-proxy"
version = "0.1.0"
description = "Thin CPI proxy that calls transfer_checked on behalf of on-chain code"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_proxy"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4.4.1"
solana-transaction = "4.1.6"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-pubkey = "4.2.1"
# Hook program types used in the integration test
solana-fall-transfer-hook = { path = "../solana-fall-transfer-hook" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
