[package]
name = "token-mover"
version = "0.1.0"
description = "Moves hooked tokens by CPI from a program that is not the hook"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_mover"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
# `onchain::add_extra_accounts_for_execute_cpi` — resolves the hook's extra
# accounts from the mint's ExtraAccountMetaList and appends them, plus the
# validation account and the hook program id, to our transfer instruction.
spl-transfer-hook-interface = "2.1.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
