[package]
name = "token-mover"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_mover"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
# The standard transfer-hook interface. `ExecuteInstruction` is the interface
# type used to tag the `transfer_hook` instruction and to bind the
# `ExtraAccountMetaList` to the Execute call (`ExtraAccountMetaList::init::
# <ExecuteInstruction>`), keeping this program interoperable with Token-2022.
spl-transfer-hook-interface = "2.1.0"

[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4.4.1"
solana-transaction = "4.1.6"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-pubkey = "4.2.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
