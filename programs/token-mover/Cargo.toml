[package]
name = "token-mover"
version = "0.1.0"
description = "CPI helper program for Token-2022 transfers"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "token_mover"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
spl-transfer-hook-interface = "2.1.0"
spl-token-2022-interface = "2.1.0"
