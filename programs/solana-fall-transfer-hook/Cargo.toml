[package]
name = "solana-fall-transfer-hook"
version = "0.1.0"
description = "Rate-limited Token-2022 transfer hook built with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_fall_transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# Anchor provides the framework, account validation macros,
# instruction contexts, errors, PDAs, and Solana utilities.
anchor-lang = "1.2.0"

# Anchor SPL provides Anchor-compatible Token-2022 account types,
# constraints, and program wrappers.
anchor-spl = "1.2.0"

# Provides ExtraAccountMeta, Seed, and ExtraAccountMetaList.
#
# These types describe the additional accounts Token-2022 must
# supply whenever it calls our transfer hook.
spl-tlv-account-resolution = "0.11.3"

# Provides the discriminator used to identify the official
# Transfer Hook Execute instruction.
spl-discriminator = "0.5.2"

# Provides the standard Token-2022 Transfer Hook interface.
#
# This keeps our program compatible with the instruction format
# that Token-2022 expects.
spl-transfer-hook-interface = "2.1.0"

[dev-dependencies]
# Runs a lightweight Solana blockchain in memory for local tests.
litesvm = "0.16.0"

# Solana utilities used to build and sign test transactions.
solana-message = "4.4.1"
solana-transaction = "4.1.6"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-pubkey = "4.2.1"

# Lets the integration test use token-mover's generated instruction
# data and account structures.
#
# This is only a test dependency. The transfer-hook program does not
# call token-mover when deployed.
#
# The no-entrypoint feature prevents token-mover from adding another
# program entrypoint inside the transfer-hook integration test.
token-mover = { path = "../token-mover", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }