[package]
name = "solana-fall-transfer-hook"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solana_fall_transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
# TLV account resolution: `ExtraAccountMeta`, `Seed` and `ExtraAccountMetaList`.
spl-tlv-account-resolution = "0.11.3"
# Provides the SPL discriminator used by the Token-2022 Execute instruction.
spl-discriminator = "0.5.2"
# Standard transfer-hook interface.
spl-transfer-hook-interface = "2.1.0"


[dev-dependencies]
litesvm = "0.16.0"
solana-message = "4.4.1"
solana-transaction = "4.1.6"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-pubkey = "4.2.1"
token-mover = { path = "../token-mover", features = ["no-entrypoint"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
